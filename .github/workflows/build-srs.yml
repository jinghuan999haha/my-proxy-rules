
name: Build SRS Rules

on:
  push:
    branches:
      - main
    paths:
      - "direct.json"
      - "proxy.json"
      - "usa.json"
      - ".github/workflows/build-srs.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh -s -- --version 1.14.4
          sing-box version

      - name: Compile SRS files
        run: |
          sing-box rule-set compile --output direct.srs direct.json
          sing-box rule-set compile --output proxy.srs proxy.json
          sing-box rule-set compile --output usa.srs usa.json

      - name: Commit SRS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add direct.srs proxy.srs usa.srs

          if ! git diff --cached --quiet; then
            git commit -m "Auto update SRS rules"
            git push
          fi
